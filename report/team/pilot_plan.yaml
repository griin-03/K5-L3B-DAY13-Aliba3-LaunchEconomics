# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 yêu cầu mỗi nhóm -> 42 nhân viên mỗi nhóm, tổng 84 > 40: KHÔNG ĐỦ
#   c) 20 nhân viên mỗi nhóm: n_eff tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251: KHÔNG ĐẠT MẪU 5 ĐIỂM
#   d) 6 depot mỗi nhóm: n_eff tối đa = c / ICC = 6 / 0,02 = 300 < 1.251: KHÔNG ĐẠT MẪU 5 ĐIỂM
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng làm việc song song cùng tuần và cùng depot với nhóm can thiệp.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed cố định ghi trước và phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro nhân viên trao đổi câu trả lời trong depot; giảm thiểu bằng phân quyền theo tài khoản cá nhân và giám sát log truy cập theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, toàn bộ chỉ số chính, ngưỡng dừng và ngày quyết định chốt trước ngày triển khai.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm nhân viên mỗi nhóm (20 can thiệp, 20 đối chứng).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận mục tiêu phát hiện mức chênh MDE = 0,06 (thay vì 0,05 ban đầu) để thỏa mãn điều kiện cỡ mẫu với 20 nhân viên mỗi nhóm (m >= 299 yêu cầu/nhân viên). Nếu tác động thực tế chỉ đạt 5 điểm, power kiểm định giảm còn 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại toàn bộ mẫu là 4,25% (trong phạm vi noi_dia + hang_nang là 3,97%). Ngưỡng an toàn chọn là mức chênh không quá 2 điểm phần trăm so với nhóm đối chứng kèm trần tuyệt đối không vượt quá 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (chi phí tương ứng 0,22x và 0,69x so với 12.000 đ, simulated); loại trừ quoc_te (1,88x) và doi_tac (0,85x)"
